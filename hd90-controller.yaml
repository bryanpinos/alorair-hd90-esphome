# =============================================================================
#  hd90-controller.yaml   --   PHASE 2: PRODUCTION FIRMWARE
#
#  Full Home-Assistant controller for the AlorAir Sentinel HD90 dehumidifier.
#  Reads status off the CAN bus, publishes to HA over MQTT (discovery), and
#  accepts commands back from HA which are translated into outbound CAN frames.
#
#  !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
#  EVERYTHING IN THE "FRAME MAP" SUBSTITUTIONS BLOCK IS A GUESS.
#  Capture real traffic with hd90-controller-sniffer.yaml (+ candump / logic
#  analyzer), decode it, then replace every value tagged  # TODO: verify.
#  Do NOT trust the parsing/command logic until you have done this.
#  !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
#
#  Wiring is identical to the sniffer build -- see that file's header.
#    SPI: SCK=GPIO5, MOSI=GPIO19, MISO=GPIO21
#    MCP2515 CS=GPIO14, INT=GPIO32 (INT unused; driver polls)
#    Wing terminal H->RJ45 pin5 (CAN-H), L->pin4 (CAN-L), - ->pin8 (GND)
# =============================================================================

substitutions:
  node_name: "hd90-controller"
  friendly_name: "HD90 Dehumidifier"

  # --- MQTT transport --------------------------------------------------------
  mqtt_broker: !secret mqtt_broker  # set in secrets.yaml (see secrets.yaml.example).
                                    # Prefer a stable DNS name over a bare IP so the
                                    # broker can move hosts without reflashing. If your
                                    # broker needs auth, add username/password in the
                                    # mqtt: block below (this config assumes anonymous).

  # --- CAN link (must match the sniffer's proven settings) -------------------
  can_bitrate: "125KBPS"           # CONFIRMED 125 kbps (verified live on the HD90)
  mcp_clock: "16MHZ"               # FeatherWing crystal (16 MHz)

  # --- Watchdog / heartbeat --------------------------------------------------
  comm_timeout_ms: "60000"         # flag comm-fault if no valid RX in 60 s
  poll_interval: "2s"              # how often we send the poll/heartbeat frame

  # --- Temperature display unit (AlorAir US units usually report degF) --------
  temp_unit: "°F"                  # TODO: confirm whether the HD90 reports F or C

  # ###########################################################################
  # #          FRAME MAP  --  READ SIDE CONFIRMED LIVE 2026-07-13              #
  # #  Verified on the actual HD90 by polling and decoding the reply:          #
  # #    poll  0x123 [00..]  ->  reply 0x123 [38 2D 15 00 03 00 00 00]         #
  # #    = RH 56%, setpoint 45%, temp 0x15=21C, byte4 bits: b0 power b1 comp   #
  # #  The unit is POLL-DRIVEN and everything is on ID 0x123, standard 11-bit. #
  # #  COMMAND side (setpoint / power / continuous) ALL VERIFIED LIVE          #
  # #  2026-07-13 via status echo. Continuous shows as byte1 == 35, NOT a      #
  # #  byte4 bit (byte4 stayed 0x03 in continuous).                            #
  # ###########################################################################

  status_use_ext:        "false"   # CONFIRMED standard 11-bit
  cmd_use_ext:           "false"   # CONFIRMED standard 11-bit

  # -- INBOUND: the reply the unit sends to our poll (same id 0x123) ----------
  status_frame_id:       "0x123"   # CONFIRMED
  status_id_mask:        "0x7FF"   # exact 11-bit match
  status_min_len:        "8"       # CONFIRMED dlc=8
  byte_humidity:         "0"       # CONFIRMED byte0 = current RH %
  byte_setpoint:         "1"       # CONFIRMED byte1 = target RH % (35 = continuous)
  byte_temp:             "2"       # CONFIRMED byte2 = temperature in DEGREES C
  byte_status:           "4"       # CONFIRMED byte4 = status bits
  bit_power:             "0x01"    # CONFIRMED bit0 = power on
  bit_compressor:        "0x02"    # CONFIRMED bit1 = compressor running
  bit_continuous:        "0x08"    # NOTE: byte4 bit3 did NOT track continuous in
                                   # testing (stayed 0x03). Continuous is instead
                                   # indicated by byte1 (setpoint) == 35. bit3 is
                                   # likely defrost -- unconfirmed.
  byte_fault:            "7"       # per RE  byte7 = error flags (0 in normal run;
                                   #         UNVERIFIED -- no fault seen yet)

  # -- OUTBOUND: WE act as the remote. Poll AND commands all use id 0x123. ----
  poll_frame_id:         "0x123"   # CONFIRMED  poll = 0x123 + 8x 0x00 (benign)
  cmd_frame_id:          "0x123"   # commands share the id; distinguished by data
  # Command byte layouts (community RE, echo-verify before trusting):
  #   set humidity : [setpoint+128, 0,0,0,0,0,0,0]  (164..218 = 36..90%;
  #                    163/0xA3 = continuous mode)               # UNVERIFIED
  #   power toggle : [0, 0, 0x01, 0,0,0,0,0]                     # UNVERIFIED
  # ###########################################################################

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev            # see sniffer notes re: adafruit_feather_esp32_v2
  framework:
    type: arduino
    advanced:
      # binary-size / IRAM optimizations (safe for this rev 3.1 board)
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

logger:
  level: INFO
  baud_rate: 115200

# --- Transport: MQTT (NOT the native API), with HA discovery -----------------
# ESPHome is satisfied by having mqtt: (no api: block needed). Entities appear
# automatically in HA under the 'homeassistant/...' discovery prefix.
mqtt:
  broker: ${mqtt_broker}
  # Broker is anonymous (no auth) -- no username/password needed.
  discovery: true
  discovery_prefix: homeassistant
  # Last-will so HA sees the node drop offline cleanly.
  birth_message:
    topic: ${node_name}/status
    payload: online
  will_message:
    topic: ${node_name}/status
    payload: offline

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "HD90-Controller Setup"
    password: !secret ap_password

captive_portal:

# --- SPI + CAN ---------------------------------------------------------------
spi:
  clk_pin: GPIO5
  mosi_pin: GPIO19
  miso_pin: GPIO21

globals:
  # millis() timestamp of the last VALID status frame, for the staleness
  # watchdog. Matches the staleness pattern used elsewhere in the EMS setup.
  - id: last_can_rx
    type: uint32_t
    restore_value: no
    initial_value: '0'

canbus:
  - platform: mcp2515
    id: hd90_can
    cs_pin: GPIO14
    clock: ${mcp_clock}
    bit_rate: ${can_bitrate}
    mode: NORMAL
    can_id: 0                # our node id for TX (adjust if the bus needs a
                             # specific source id -- verify against candump)
    on_frame:
      # ---- decode the dehumidifier's status frame ----
      - can_id: ${status_frame_id}
        can_id_mask: ${status_id_mask}
        use_extended_id: ${status_use_ext}
        then:
          - lambda: |-
              // Guard against short/garbage frames before trusting offsets.
              if (x.size() < ${status_min_len}) return;

              // -------- READ SIDE CONFIRMED LIVE (see FRAME MAP) --------
              float rh    = (float) x[${byte_humidity}];                 // %RH
              float temp  = (float) x[${byte_temp}] * 9.0f/5.0f + 32.0f; // byte = degC -> degF
              bool  comp  = (x[${byte_status}] & ${bit_compressor}) != 0;
              uint8_t setp = x[${byte_setpoint}];                        // target RH
              uint8_t flt  = x[${byte_fault}];                           // error flags (byte7; unverified)
              // ----------------------------------------------------------

              id(last_can_rx) = millis();   // feed the watchdog

              id(hd90_humidity).publish_state(rh);
              id(hd90_temperature).publish_state(temp);
              id(hd90_reported_setpoint).publish_state(setp);
              id(hd90_compressor).publish_state(comp);

              // Report fault as a short hex string; "OK" when zero.
              if (flt == 0) {
                id(hd90_fault_code).publish_state("OK");
              } else {
                char b[8];
                sprintf(b, "0x%02X", flt);
                id(hd90_fault_code).publish_state(b);
              }

# --- Outbound heartbeat + staleness watchdog ---------------------------------
interval:
  # Mirror the stock remote's poll/heartbeat so the unit keeps talking to us.
  - interval: ${poll_interval}
    then:
      - canbus.send:
          canbus_id: hd90_can
          can_id: ${poll_frame_id}
          use_extended_id: ${cmd_use_ext}
          # CONFIRMED: 0x123 + all zeros elicits the status reply (benign poll).
          data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

  # Watchdog: raise comm-fault if the unit has gone quiet.
  - interval: 5s
    then:
      - lambda: |-
          bool stale = (id(last_can_rx) == 0) ||
                       (millis() - id(last_can_rx) > ${comm_timeout_ms});
          id(hd90_comm_fault).publish_state(stale);

# --- Read-only entities published to HA --------------------------------------
sensor:
  - platform: template
    name: "HD90 Humidity"
    id: hd90_humidity
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never      # pushed from the CAN on_frame lambda

  - platform: template
    name: "HD90 Temperature"
    id: hd90_temperature
    unit_of_measurement: ${temp_unit}
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "HD90 Reported Target Humidity"
    id: hd90_reported_setpoint
    unit_of_measurement: "%"
    device_class: humidity
    accuracy_decimals: 0
    update_interval: never

  # diagnostics
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 30s

binary_sensor:
  - platform: template
    name: "HD90 Compressor Running"
    id: hd90_compressor
    device_class: running

  - platform: template
    name: "HD90 Communication Fault"
    id: hd90_comm_fault
    device_class: problem      # ON = problem (stale/no CAN data)

text_sensor:
  - platform: template
    name: "HD90 Fault Code"
    id: hd90_fault_code

# --- Command entities (HA -> CAN) --------------------------------------------
number:
  - platform: template
    name: "HD90 Target Humidity"
    id: hd90_target_humidity_set
    optimistic: true            # no command ack yet; assume applied
    min_value: 36               # RE: settable range 36-90% (send value+128)
    max_value: 90
    step: 1
    unit_of_measurement: "%"
    mode: box
    set_action:
      - canbus.send:
          canbus_id: hd90_can
          can_id: ${cmd_frame_id}
          use_extended_id: ${cmd_use_ext}
          data: !lambda |-
            // VERIFIED LIVE 2026-07-13: setpoint = [pct + 128, 0, ...]; byte1 of
            // the status reply echoes the new setpoint. 36-90% -> 164-218.
            uint8_t sp = (uint8_t) x + 128;
            return { sp, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00 };

button:
  # Power is a TOGGLE on this protocol, so it's a button, not an on/off switch.
  - platform: template
    name: "HD90 Power Toggle"
    id: hd90_power_toggle
    on_press:
      - canbus.send:
          canbus_id: hd90_can
          can_id: ${cmd_frame_id}
          use_extended_id: ${cmd_use_ext}
          # VERIFIED LIVE 2026-07-13: [0,0,0x01,...] toggles power; byte4 bit0 of
          # the status reply flips. It is a TOGGLE (same frame both ways).
          data: [0x00, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00]

  - platform: template
    name: "HD90 Continuous Mode"
    id: hd90_continuous_mode
    on_press:
      - canbus.send:
          canbus_id: hd90_can
          can_id: ${cmd_frame_id}
          use_extended_id: ${cmd_use_ext}
          # VERIFIED LIVE 2026-07-13: [0xA3,...] (=setpoint 163/35) sets
          # continuous; status byte1 reads 35. Exit = send a normal setpoint.
          data: [0xA3, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
